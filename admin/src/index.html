      rel="stylesheet"
    />
    <script>
      // Set the theme before Angular boots so there is no light flash in dark mode.
      (function () {
        try {
          var mode = localStorage.getItem('theme');
          var dark = mode === 'Dark Theme' || (mode !== 'Light Theme' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <obum-root></obum-root>
  </body>
</html>
