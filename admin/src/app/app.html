<div class="backdrop" aria-hidden="true"></div>

<header class="topbar" [class.scrolled]="scrolled()">
  <div class="topbar-inner">
    <a class="brand" href="https://obumnwabude.com" target="_blank" rel="noopener" aria-label="Obum, opens obumnwabude.com">
      <span class="brand-name">Obum</span><span class="brand-dot" aria-hidden="true"></span>
    </a>
    <span class="section">Links</span>

    <span class="spacer"></span>

    <button class="search-trigger" type="button" (click)="openPalette()" aria-label="Search links and actions">
      <mat-icon>search</mat-icon>
      <span class="label">Search or jump to</span>
      <kbd>{{ isMac ? '⌘' : 'Ctrl' }} K</kbd>
    </button>

    <obum-theme-menu />

    @if (auth.user(); as user) {
      <button class="avatar" type="button" [matMenuTriggerFor]="accountMenu" [attr.aria-label]="'Account: ' + (user.email ?? 'signed in')">
        @if (user.photoURL) {
          <img [src]="user.photoURL" alt="" referrerpolicy="no-referrer" width="36" height="36" />
        } @else {
          <mat-icon>person</mat-icon>
        }
      </button>
      <mat-menu #accountMenu="matMenu" xPosition="before" class="glass-menu">
        <div class="account-info">
          <strong>{{ user.displayName ?? 'Signed in' }}</strong>
          <span>{{ user.email }}</span>
          @if (auth.isAdmin()) {
            <span class="role">Admin</span>
          }
        </div>
        <button mat-menu-item type="button" (click)="auth.signOut()"><mat-icon>logout</mat-icon>Sign out</button>
      </mat-menu>
    } @else if (onAuthPage()) {
      <button class="sign-in" type="button" (click)="auth.signIn()" [disabled]="auth.busy()">
        <img src="google.svg" alt="" width="18" height="18" />
        <span>Sign in with Google</span>
      </button>
    }
  </div>
  <div class="progress" aria-hidden="true" [style.transform]="'scaleX(' + progress() + ')'"></div>
</header>

<main class="page">
  <obum-links-view />
</main>

@if (panelOpen()) {
  <div class="scrim" aria-hidden="true" (click)="panel.close()"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="Link details" cdkTrapFocus cdkTrapFocusAutoCapture>
    <obum-link-panel />
  </aside>
}
